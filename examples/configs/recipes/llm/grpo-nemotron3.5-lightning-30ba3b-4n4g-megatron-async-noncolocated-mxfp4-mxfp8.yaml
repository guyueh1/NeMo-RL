defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_steps: 2
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: true
loss_fn:
  use_importance_sampling_correction: true
  force_on_policy_ratio: true
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-nemotron3.5-lightning-30ba3b-4n4g-megatron-async-noncolocated-mxfp4-mxfp8
policy:
  # Megatron-Bridge expects logical, unpacked training tensors. The deployment
  # NVFP4 checkpoint packs two E2M1 values per byte (for example lm_head is
  # [131072, 1344] instead of [131072, 2688]), so initialize the trainable
  # policy from the architecture-equivalent BF16 release. The rollout refit
  # below still applies MXFP4 fake quantization and stores/runs weights as
  # MXFP8; the NVFP4 release supplies the requested tokenizer identity.
  model_name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
  train_global_batch_size: 32
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 8192
  make_sequence_length_divisible_by: 16
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    activation_checkpointing: true
    freeze_moe_router: true
    moe_router_dtype: fp32
    moe_router_load_balancing_type: none
    moe_router_enable_expert_bias: true
    moe_token_dispatcher_type: alltoall
    moe_grouped_gemm: true
    use_fused_weighted_squared_relu: true
    bias_activation_fusion: false
    mtp_loss_scaling_factor: 0.3
    mtp_use_repeated_layer: true
    mtp_num_layers: 5
    mtp_detach_heads: true
    fp8_cfg:
      enabled: true
      fp8: e4m3
      fp8_recipe: mxfp8
      fp8_param: true
      mxfp4_moe_weight_fake_quant: true
    optimizer:
      use_precision_aware_optimizer: false
    env_vars:
      NVTE_FP8_BLOCK_SCALING_FP32_SCALES: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  sequence_packing:
    enabled: false
  generation:
    backend: vllm
    refit_transport: nccl_reshard
    colocated:
      enabled: false
      resources:
        num_nodes: 2
        gpus_per_node: 4
    vllm_cfg:
      async_engine: true
      tensor_parallel_size: 1
      expert_parallel_size: 1
      # Leave room for the logical BF16 refit shard plus MXFP4/MXFP8 packing.
      gpu_memory_utilization: 0.7
      precision: fp8
      is_mx: true
      mxfp4_moe_weight_fake_quant: true
      quantization_ignore_patterns:
        - model.layers.*.self_attn.*
        - model.layers.*.linear_attn.*
        - model.layers.*.mlp.gate
        - model.layers.*.mlp.shared_expert*
        - lm_head
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
data:
  max_input_seq_length: 2048
  train:
    dataset_name: OpenMathInstruct-2
  validation: null
logger:
  log_dir: logs/grpo-nemotron3.5-lightning-30ba3b-4n4g-megatron-async-noncolocated-mxfp4-mxfp8
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-nemotron3.5-lightning-30ba3b-4n4g-megatron-async-noncolocated-mxfp4-mxfp8
cluster:
  gpus_per_node: 4
  num_nodes: 4
  segment_size: 2
